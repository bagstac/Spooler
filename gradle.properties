# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX is the only supported library set for new projects.
android.useAndroidX=true
# Only generate R classes for this module's own resources.
android.nonTransitiveRClass=true
kotlin.code.style=official
# AGP 8.7.3 predates official compileSdk=36 testing but builds fine against
# it — silences the advisory warning rather than actually being unsupported.
android.suppressUnsupportedCompileSdk=36
